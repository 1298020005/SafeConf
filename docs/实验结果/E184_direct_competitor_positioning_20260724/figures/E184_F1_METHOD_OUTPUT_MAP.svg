<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    text { font-family: Arial, sans-serif; }
    .title { font-size: 42px; font-weight: 700; fill: #17212b; }
    .sub { font-size: 22px; font-weight: 400; fill: #52606d; }
    .head { font-size: 27px; font-weight: 700; fill: #17212b; }
    .body { font-size: 21px; font-weight: 400; fill: #344250; }
    .small { font-size: 18px; font-weight: 400; fill: #52606d; }
    .tag { font-size: 17px; font-weight: 700; fill: #ffffff; letter-spacing: .7px; }
    .arrow { stroke: #72808e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#72808e"/>
    </marker>
  </defs>

  <text x="90" y="82" class="title">What each uncertainty method actually certifies</text>
  <text x="90" y="124" class="sub">Single-cell perturbation prediction · definition-level comparison · E184</text>
  <line x1="90" y1="154" x2="1510" y2="154" stroke="#d8dee4" stroke-width="2"/>

  <rect x="90" y="205" rx="20" ry="20" width="420" height="500" fill="#f6f8fa" stroke="#cfd7df" stroke-width="2"/>
  <rect x="120" y="235" rx="12" ry="12" width="218" height="34" fill="#5b6f82"/>
  <text x="142" y="258" class="tag">MODEL-INTERNAL</text>
  <text x="120" y="320" class="head">GEARS · PRESCRIBE</text>
  <text x="120" y="357" class="head">GPerturb</text>
  <text x="120" y="412" class="body">Predictor-specific variance,</text>
  <text x="120" y="444" class="body">confidence, or posterior</text>
  <line x1="120" y1="482" x2="480" y2="482" stroke="#d8dee4" stroke-width="2"/>
  <text x="120" y="528" class="small">Requires training or internal state</text>
  <text x="120" y="566" class="small">Useful for its own predictor</text>
  <text x="120" y="604" class="small">No distribution-free task-RMSE</text>
  <text x="120" y="632" class="small">coverage claim by itself</text>
  <rect x="120" y="661" rx="9" ry="9" width="190" height="34" fill="#e8eef3"/>
  <text x="140" y="684" class="small">confidence signal</text>

  <rect x="590" y="205" rx="20" ry="20" width="420" height="500" fill="#f7fbff" stroke="#8bb8dc" stroke-width="3"/>
  <rect x="620" y="235" rx="12" ry="12" width="176" height="34" fill="#397faf"/>
  <text x="643" y="258" class="tag">CALIBRATION</text>
  <text x="620" y="320" class="head">Split conformal · CQR</text>
  <text x="620" y="357" class="head">Hierarchical conformal</text>
  <text x="620" y="412" class="body">Prediction set or error upper</text>
  <text x="620" y="444" class="body">bound from calibration truth</text>
  <line x1="620" y1="482" x2="980" y2="482" stroke="#c9ddea" stroke-width="2"/>
  <text x="620" y="528" class="small">Works with a fixed black box</text>
  <text x="620" y="566" class="small">Finite-sample marginal coverage</text>
  <text x="620" y="604" class="small">Needs exchangeability and the</text>
  <text x="620" y="632" class="small">correct calibration unit</text>
  <rect x="620" y="661" rx="9" ry="9" width="205" height="34" fill="#dceefa"/>
  <text x="640" y="684" class="small">calibrated upper</text>

  <rect x="1090" y="205" rx="20" ry="20" width="420" height="500" fill="#fffaf3" stroke="#d59a45" stroke-width="3"/>
  <rect x="1120" y="235" rx="12" ry="12" width="190" height="34" fill="#b87925"/>
  <text x="1142" y="258" class="tag">SAFECONF</text>
  <text x="1120" y="320" class="head">Registered frozen family</text>
  <text x="1120" y="357" class="head">Post-hoc error certificate</text>
  <text x="1120" y="412" class="body">Truth-free family lower bounds</text>
  <text x="1120" y="444" class="body">+ transferred centroid upper</text>
  <line x1="1120" y1="482" x2="1480" y2="482" stroke="#ead9bf" stroke-width="2"/>
  <text x="1120" y="528" class="small">No predictor retraining</text>
  <text x="1120" y="566" class="small">Target-cluster calibration</text>
  <text x="1120" y="604" class="small">Explicit centroid-shift cost</text>
  <text x="1120" y="632" class="small">Fail-closed truth access</text>
  <rect x="1120" y="661" rx="9" ry="9" width="282" height="34" fill="#f7e6cb"/>
  <text x="1140" y="684" class="small">deterministic lower + upper</text>

  <path d="M510 455 C545 455, 555 455, 590 455" class="arrow"/>
  <path d="M1010 455 C1045 455, 1055 455, 1090 455" class="arrow"/>
  <text x="521" y="426" class="small">different</text>
  <text x="1021" y="426" class="small">combined in</text>

  <rect x="90" y="770" rx="14" ry="14" width="1420" height="78" fill="#f6f8fa" stroke="#d8dee4" stroke-width="2"/>
  <text x="120" y="803" class="small">Novelty boundary:</text>
  <text x="275" y="803" class="small">the ambiguity identity and split conformal are classical.</text>
  <text x="120" y="833" class="small">SafeConf contributes the registered-family certificate object, centroid transfer, target-cluster protocol, and cross-study validation.</text>
</svg>
